name: Continuous Integration & Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  verify:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck & Code Validation
        run: npm run lint

      - name: Test Server Boot & Self-Check
        run: |
          node -e "
            import('./server.js').then(async () => {
              console.log('Server initialized successfully in CI environment');
              process.exit(0);
            }).catch(err => {
              console.error('CI Boot Check Failed:', err);
              process.exit(1);
            });
          "
